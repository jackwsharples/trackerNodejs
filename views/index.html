<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MotoTrack</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #070c12;
      --bg2:       #050810;
      --panel:     #0c1520;
      --panel2:    #091119;
      --border:    rgba(100,180,255,0.10);
      --border2:   rgba(100,180,255,0.20);
      --text:      #d8e8f5;
      --muted:     #4e6a85;
      --accent:    #22d3ee;
      --accent2:   #0ea5e9;
      --ok:        #22c55e;
      --warn:      #f59e0b;
      --danger:    #ef4444;
      --shadow:    rgba(0,0,0,0.55);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ===== HEADER ===== */
    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(7,12,18,0.90);
      backdrop-filter: blur(14px) saturate(120%);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      display: flex; align-items: center; gap: 14px;
      max-width: 1440px; margin: 0 auto;
      padding: 0 24px; height: 54px;
    }
    .logo {
      display: flex; align-items: center; gap: 9px;
      font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
      color: var(--text); white-space: nowrap;
    }
    .logo-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px rgba(34,211,238,0.18), 0 0 8px var(--accent);
      transition: background 0.4s, box-shadow 0.4s;
      flex-shrink: 0;
    }
    .logo-dot.warn  { background: var(--warn);  box-shadow: 0 0 0 2px rgba(245,158,11,0.18),  0 0 8px var(--warn); }
    .logo-dot.off   { background: var(--muted); box-shadow: none; }
    .logo-sep { color: var(--muted); font-weight: 300; margin: 0 2px; }
    .logo-sub { color: var(--muted); font-weight: 400; font-size: 13px; }
    .spacer { flex: 1; }

    .status-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel); color: var(--muted);
      font-size: 12px; font-weight: 500;
      transition: border-color 0.3s, color 0.3s;
    }
    .status-pill .pip {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); transition: background 0.3s, box-shadow 0.3s;
    }
    .status-pill.live { border-color: rgba(34,197,94,0.3); color: var(--ok); }
    .status-pill.live .pip { background: var(--ok); box-shadow: 0 0 5px var(--ok); animation: blink 2s infinite; }
    .status-pill.warn { border-color: rgba(245,158,11,0.25); color: var(--warn); }
    .status-pill.warn .pip { background: var(--warn); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.45} }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 9px; cursor: pointer;
      font-size: 13px; font-family: inherit; font-weight: 500;
      border: 1px solid var(--border);
      background: var(--panel); color: var(--text);
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--border2); background: rgba(12,21,32,0.9); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: linear-gradient(135deg,#0e3d58,#082d44);
      border-color: rgba(14,165,233,0.35); color: #7dd3fc;
    }
    .btn.primary:hover { border-color: rgba(14,165,233,0.55); }

    /* ===== LAYOUT ===== */
    .wrap {
      max-width: 1440px; margin: 0 auto;
      padding: 18px 24px; display: flex; flex-direction: column; gap: 14px;
    }

    .card {
      background: linear-gradient(160deg, var(--panel) 0%, var(--panel2) 100%);
      border: 1px solid var(--border);
      border-radius: 13px;
      box-shadow: 0 6px 28px var(--shadow);
    }

    /* ===== DASHBOARD GRID ===== */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 284px;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 920px) { .dashboard { grid-template-columns: 1fr; } }

    /* ===== MAP PANEL ===== */
    .map-panel { overflow: hidden; }

    .panel-header {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; color: var(--muted);
      text-transform: uppercase;
    }
    .live-tag {
      display: flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--ok);
    }
    .live-tag::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: var(--ok); box-shadow: 0 0 5px var(--ok);
      animation: blink 2s infinite;
    }
    .utc-clock {
      font-size: 11px; font-family: 'Courier New', monospace;
      color: var(--muted); letter-spacing: 0.04em;
    }

    #mainMap { width: 100%; height: 450px; }
    @media (max-width: 600px) { #mainMap { height: 300px; } }

    .map-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px; border-top: 1px solid var(--border); flex-wrap: wrap;
    }
    .map-ctrl-btn {
      padding: 5px 11px; border-radius: 7px; cursor: pointer;
      font-size: 11px; font-family: inherit; font-weight: 500;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03); color: var(--muted);
      transition: color 0.15s, border-color 0.15s;
    }
    .map-ctrl-btn:hover { color: var(--text); border-color: var(--border2); }
    .map-ctrl-btn:active { transform: translateY(1px); }
    .map-meta { font-size: 11px; color: var(--muted); margin-left: auto; }

    /* ===== STATS COLUMN ===== */
    .stats-col { display: flex; flex-direction: column; gap: 12px; }

    .stat-card { padding: 15px 16px; }
    .stat-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 7px;
    }
    .stat-big {
      font-size: 34px; font-weight: 700; line-height: 1;
      color: var(--text);
      display: flex; align-items: baseline; gap: 5px;
    }
    .stat-unit { font-size: 13px; font-weight: 400; color: var(--muted); }
    .stat-sub  { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .progress {
      margin-top: 9px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.05); overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width 0.5s ease;
      min-width: 0; max-width: 100%;
    }
    .stat-med { font-size: 22px; font-weight: 600; color: var(--text); }

    /* ===== STATUS ROW ===== */
    .status-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px;
    }
    @media (max-width: 680px) { .status-row { grid-template-columns: 1fr; } }

    .status-card {
      padding: 13px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .status-key {
      font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
    }
    .status-val { font-size: 17px; font-weight: 600; color: var(--text); }

    .badge {
      padding: 3px 9px; border-radius: 20px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; border: 1px solid; white-space: nowrap; flex-shrink: 0;
    }
    .badge-ok   { color: var(--ok);     border-color: rgba(34,197,94,0.30);  background: rgba(34,197,94,0.08); }
    .badge-warn { color: var(--warn);   border-color: rgba(245,158,11,0.30); background: rgba(245,158,11,0.08); }
    .badge-off  { color: var(--muted);  border-color: rgba(78,106,133,0.30); background: rgba(78,106,133,0.08); }
    .badge-live { color: var(--accent); border-color: rgba(34,211,238,0.30); background: rgba(34,211,238,0.08); }

    /* ===== ACTIVITY LOG ===== */
    .log-body { padding: 4px 16px 14px; }
    .log-entry {
      display: flex; align-items: flex-start; gap: 11px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .log-entry:last-child { border-bottom: none; }
    .log-pip {
      width: 9px; height: 9px; border-radius: 50%;
      margin-top: 5px; flex-shrink: 0;
    }
    .pip-accent { background: var(--accent); box-shadow: 0 0 6px rgba(34,211,238,0.6); }
    .pip-ok     { background: var(--ok); }
    .pip-warn   { background: var(--warn); }
    .pip-off    { background: var(--muted); }
    .log-title  { font-size: 13px; font-weight: 600; }
    .log-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .log-time   {
      margin-left: auto; flex-shrink: 0;
      padding: 3px 8px; border-radius: 5px;
      font-size: 10px; color: var(--muted);
      background: rgba(255,255,255,0.035); border: 1px solid var(--border);
    }
    .log-empty { padding: 22px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ===== HISTORY PANEL ===== */
    #historyPanel { overflow: hidden; }
    #historyMap { width: 100%; height: 480px; }
  </style>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070c12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>

<header>
  <div class="nav">
    <div class="logo">
      <div class="logo-dot" id="logoDot"></div>
      <span>MotoTrack</span>
      <span class="logo-sep">&mdash;</span>
      <span class="logo-sub">Live GPS</span>
    </div>
    <div class="spacer"></div>
    <div class="status-pill" id="statusPill">
      <div class="pip"></div>
      <span id="statusPillText">Loading&hellip;</span>
    </div>
    <button class="btn primary" id="btnRefreshAll">&#8635; Refresh</button>
  </div>
</header>

<div class="wrap">

  <!-- Dashboard: map + stats -->
  <div class="dashboard">

    <!-- Map -->
    <div class="card map-panel">
      <div class="panel-header">
        <span class="panel-label">Main Map</span>
        <span class="live-tag" id="liveTag">Live</span>
        <div class="spacer"></div>
        <span class="utc-clock" id="utcClock">UTC --:--:--</span>
      </div>
      <div id="mainMap"></div>
      <div class="map-footer">
        <button class="map-ctrl-btn" id="btnFitRide">Fit Ride</button>
        <button class="map-ctrl-btn" id="btnGoLatest">Latest Point</button>
        <button class="map-ctrl-btn" id="btnRefreshMap">&#8635; Refresh</button>
        <span class="map-meta" id="mapMeta"></span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-col">
      <div class="card stat-card">
        <div class="stat-label">Speed</div>
        <div class="stat-big">
          <span id="statSpeed">--</span>
          <span class="stat-unit">mph</span>
        </div>
        <div class="stat-sub" id="statSpeedSub">Last recorded</div>
        <div class="progress">
          <div class="progress-fill" id="speedFill" style="width:0%"></div>
        </div>
      </div>

      <div class="card stat-card">
        <div class="stat-label">Last Seen</div>
        <div class="stat-med" id="statLastSeen">--</div>
        <div class="stat-sub" id="statLastSeenFull">--</div>
      </div>

      <div class="card stat-card">
        <div class="stat-label">Current Ride</div>
        <div class="stat-med" id="statRidePts">-- pts</div>
        <div class="stat-sub" id="statRideMeta">--</div>
      </div>

      <div class="card stat-card">
        <div class="stat-label">All Time</div>
        <div class="stat-med" id="statTotalPts">--</div>
        <div class="stat-sub" id="statTotalRides">-- rides recorded</div>
      </div>
    </div>
  </div>

  <!-- Status row -->
  <div class="status-row">
    <div class="card status-card">
      <div>
        <div class="status-key">Movement</div>
        <div class="status-val" id="movVal">--</div>
      </div>
      <span class="badge badge-off" id="movBadge">--</span>
    </div>
    <div class="card status-card">
      <div>
        <div class="status-key">Last Ride</div>
        <div class="status-val" id="lastRideVal">--</div>
      </div>
      <span class="badge badge-off" id="lastRideBadge">--</span>
    </div>
    <div class="card status-card">
      <div>
        <div class="status-key">Database</div>
        <div class="status-val" id="dbVal">--</div>
      </div>
      <span class="badge badge-off" id="dbBadge">--</span>
    </div>
  </div>

  <!-- Activity log -->
  <div class="card">
    <div class="panel-header">
      <span class="panel-label">Activity Log</span>
      <div class="spacer"></div>
      <button class="btn" id="btnRefreshLog">&#8635; Refresh</button>
      <button class="btn primary" id="btnOpenHistory">View History</button>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-empty">Loading&hellip;</div>
    </div>
  </div>

  <!-- History panel (hidden, loads on demand) -->
  <div class="card" id="historyPanel" style="display:none">
    <div class="panel-header">
      <span class="panel-label">Ride History</span>
      <div class="spacer"></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)">
        Points
        <input type="number" id="historyLimit" class="map-ctrl-btn"
          style="width:76px;text-align:center;cursor:text"
          min="100" max="10000" step="100" value="2000" />
      </label>
      <button class="btn primary" id="btnLoadHistory">Load</button>
      <button class="btn" id="btnCloseHistory">Close</button>
    </div>
    <div id="historyMap"></div>
    <div class="map-footer">
      <button class="map-ctrl-btn" id="btnFitHistory">Fit All</button>
      <span class="map-meta" id="historyMeta"></span>
    </div>
  </div>

</div><!-- /wrap -->

<script>
// ===== UTILITIES =====

function relativeTime(dateStr) {
  var d = new Date(dateStr);
  if (isNaN(d)) return '--';
  var diff = Date.now() - d.getTime();
  var sec = Math.floor(diff / 1000);
  if (sec < 60) return sec + 's ago';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + 'm ago';
  var hr = Math.floor(min / 60);
  if (hr < 24) return hr + 'h ago';
  return Math.floor(hr / 24) + 'd ago';
}

function formatDuration(ms) {
  if (!ms || ms <= 0) return '--';
  var min = Math.floor(ms / 60000);
  if (min < 60) return min + 'm';
  var hr = Math.floor(min / 60);
  var rm = min % 60;
  return rm ? hr + 'h ' + rm + 'm' : hr + 'h';
}

function shortDate(dateStr) {
  var d = new Date(dateStr);
  if (isNaN(d)) return '--';
  var now = new Date();
  var time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'Today ' + time;
  var yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return 'Yesterday ' + time;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
}

function haversineMi(lat1, lon1, lat2, lon2) {
  var R = 3958.8;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
          Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function rideDistanceMi(points) {
  var d = 0;
  for (var i = 1; i < points.length; i++) {
    d += haversineMi(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon);
  }
  return d;
}

// ===== UTC CLOCK =====
function tickClock() {
  var n = new Date();
  var h = String(n.getUTCHours()).padStart(2,'0');
  var m = String(n.getUTCMinutes()).padStart(2,'0');
  var s = String(n.getUTCSeconds()).padStart(2,'0');
  document.getElementById('utcClock').textContent = 'UTC ' + h + ':' + m + ':' + s;
}
setInterval(tickClock, 1000);
tickClock();

// ===== CONNECTION STATUS =====
function setConnectionStatus(lastTs) {
  var dot     = document.getElementById('logoDot');
  var pill    = document.getElementById('statusPill');
  var pillTxt = document.getElementById('statusPillText');
  var liveTag = document.getElementById('liveTag');

  if (!lastTs) {
    dot.className = 'logo-dot off';
    pill.className = 'status-pill';
    pillTxt.textContent = 'No data';
    liveTag.style.display = 'none';
    return;
  }

  var ageMin = (Date.now() - new Date(lastTs).getTime()) / 60000;
  if (ageMin < 10) {
    dot.className = 'logo-dot';
    pill.className = 'status-pill live';
    pillTxt.textContent = 'Live';
    liveTag.style.display = 'flex';
  } else if (ageMin < 60) {
    dot.className = 'logo-dot warn';
    pill.className = 'status-pill warn';
    pillTxt.textContent = Math.floor(ageMin) + 'm ago';
    liveTag.style.display = 'none';
  } else {
    dot.className = 'logo-dot off';
    pill.className = 'status-pill';
    var h = Math.floor(ageMin / 60);
    pillTxt.textContent = h < 24 ? h + 'h ago' : Math.floor(h/24) + 'd ago';
    liveTag.style.display = 'none';
  }
}

// ===== MAIN MAP =====
var mainMap, rideLine, startMark, latestMark;
var currentBounds = null;
var latestLatLng  = null;

function initMainMap() {
  mainMap = L.map('mainMap', { zoomControl: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 20, attribution: '&copy; CARTO'
  }).addTo(mainMap);
  mainMap.setView([36.214, -81.668], 13);
}

function clearMainLayers() {
  if (rideLine)    { mainMap.removeLayer(rideLine);    rideLine = null; }
  if (startMark)   { mainMap.removeLayer(startMark);   startMark = null; }
  if (latestMark)  { mainMap.removeLayer(latestMark);  latestMark = null; }
}

async function loadLastRide() {
  try {
    var res = await fetch('/last-ride');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();

    if (!data || !data.points || !data.points.length) {
      document.getElementById('mapMeta').textContent = 'No ride data';
      document.getElementById('statRidePts').textContent = '--';
      document.getElementById('statRideMeta').textContent = 'No rides yet';
      return null;
    }

    var pts = data.points.filter(function(p) { return p.lat && p.lon; });
    if (!pts.length) return null;

    var coords = pts.map(function(p) { return [p.lat, p.lon]; });

    clearMainLayers();

    // Ride polyline
    rideLine = L.polyline(coords, { color: '#22d3ee', weight: 3, opacity: 0.85 }).addTo(mainMap);
    currentBounds = rideLine.getBounds();
    mainMap.fitBounds(currentBounds, { padding: [28, 28] });

    // Start marker (green)
    startMark = L.circleMarker(coords[0], {
      radius: 7, color: '#22c55e', weight: 2,
      fillColor: '#22c55e', fillOpacity: 0.9
    }).addTo(mainMap).bindPopup('Ride start<br>' + shortDate(data.startedAt));

    // Latest position (teal)
    var lastCoord = coords[coords.length - 1];
    var lastPt = pts[pts.length - 1];
    latestMark = L.circleMarker(lastCoord, {
      radius: 9, color: '#22d3ee', weight: 2,
      fillColor: '#22d3ee', fillOpacity: 0.9
    }).addTo(mainMap).bindPopup('Latest position<br>' + shortDate(lastPt.ts));
    latestLatLng = lastCoord;

    // Distance
    var distMi = rideDistanceMi(pts);
    var distStr = distMi > 0.05 ? distMi.toFixed(1) + ' mi' : '';

    // Duration
    var endTs = data.endedAt || lastPt.ts;
    var dur = new Date(endTs) - new Date(data.startedAt);
    var durStr = formatDuration(dur);

    // Avg speed from points that have it (convert kph -> mph)
    var speeds = pts.map(function(p) { return p.speedKph; }).filter(function(s) { return s != null && s > 0; });
    var avgSpeedStr = speeds.length ? Math.round(speeds.reduce(function(a,b){return a+b;},0)/speeds.length * 0.621371) + ' mph avg' : '';

    document.getElementById('mapMeta').textContent = pts.length + ' pts' + (distStr ? ' \u00b7 ' + distStr : '');
    document.getElementById('statRidePts').textContent = pts.length + ' pts' + (distStr ? ' \u00b7 ' + distStr : '');
    document.getElementById('statRideMeta').textContent = shortDate(data.startedAt) + (durStr !== '--' ? ' \u00b7 ' + durStr : '') + (avgSpeedStr ? ' \u00b7 ' + avgSpeedStr : '');

    return lastPt;
  } catch (e) {
    console.error('loadLastRide', e);
    document.getElementById('mapMeta').textContent = 'Error loading ride';
    return null;
  }
}

document.getElementById('btnFitRide').onclick = function() {
  if (currentBounds) mainMap.fitBounds(currentBounds, { padding: [28, 28] });
};
document.getElementById('btnGoLatest').onclick = function() {
  if (latestLatLng) mainMap.setView(latestLatLng, 17);
};
document.getElementById('btnRefreshMap').onclick = refreshAll;

// ===== LATEST STATS =====
async function loadLatest() {
  try {
    var res = await fetch('/latest');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var d = await res.json();
    if (!d) { setConnectionStatus(null); return; }

    setConnectionStatus(d.timestamp);

    var ageMin = (Date.now() - new Date(d.timestamp).getTime()) / 60000;

    // Speed
    if (d.speedKph != null) {
      var spd = Math.round(d.speedKph * 0.621371);
      document.getElementById('statSpeed').textContent = spd;
      document.getElementById('statSpeedSub').textContent = shortDate(d.timestamp);
      document.getElementById('speedFill').style.width = Math.min(100, (spd / 130) * 100) + '%';
    } else {
      document.getElementById('statSpeed').textContent = '--';
      document.getElementById('statSpeedSub').textContent = 'No speed data from device';
      document.getElementById('speedFill').style.width = '0%';
    }

    // Last seen
    document.getElementById('statLastSeen').textContent = relativeTime(d.timestamp);
    document.getElementById('statLastSeenFull').textContent = shortDate(d.timestamp);

    // Movement status
    var movVal   = document.getElementById('movVal');
    var movBadge = document.getElementById('movBadge');
    if (ageMin < 5) {
      movVal.textContent = 'Detected';
      movBadge.textContent = 'Tracking';
      movBadge.className = 'badge badge-live';
    } else if (ageMin < 60) {
      movVal.textContent = 'Idle';
      movBadge.textContent = 'Idle';
      movBadge.className = 'badge badge-warn';
    } else {
      movVal.textContent = 'Offline';
      movBadge.textContent = 'No Signal';
      movBadge.className = 'badge badge-off';
    }
  } catch (e) {
    console.error('loadLatest', e);
    setConnectionStatus(null);
  }
}

// ===== HEALTH =====
async function loadHealth() {
  try {
    var res = await fetch('/health');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var d = await res.json();
    var pts = (d.pings_stored || 0).toLocaleString();
    document.getElementById('statTotalPts').textContent = pts + ' data points';
    document.getElementById('dbVal').textContent = pts + ' pts';
    document.getElementById('dbBadge').textContent = 'OK';
    document.getElementById('dbBadge').className = 'badge badge-ok';
  } catch (e) {
    document.getElementById('dbVal').textContent = 'Error';
    document.getElementById('dbBadge').textContent = 'Error';
    document.getElementById('dbBadge').className = 'badge badge-warn';
  }
}

// ===== RIDES LIST =====
async function loadRides() {
  try {
    var res = await fetch('/rides?limit=15');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var d = await res.json();
    var rides = d.rides || [];

    // Total rides stat
    document.getElementById('statTotalRides').textContent = rides.length + ' rides recorded';

    // Last ride status bar
    if (rides.length) {
      var first = rides[0];
      var ageMin = (Date.now() - new Date(first.startedAt).getTime()) / 60000;
      document.getElementById('lastRideVal').textContent = relativeTime(first.startedAt);
      var lrBadge = document.getElementById('lastRideBadge');
      if (ageMin < 60) {
        lrBadge.textContent = 'Recent';
        lrBadge.className = 'badge badge-ok';
      } else if (ageMin < 60 * 24) {
        lrBadge.textContent = 'Today';
        lrBadge.className = 'badge badge-warn';
      } else {
        lrBadge.textContent = shortDate(first.startedAt).split(' ')[0];
        lrBadge.className = 'badge badge-off';
      }
    }

    renderLog(rides);
  } catch (e) {
    console.error('loadRides', e);
    document.getElementById('logBody').innerHTML = '<div class="log-empty">Failed to load ride history.</div>';
  }
}

function renderLog(rides) {
  var body = document.getElementById('logBody');
  if (!rides.length) {
    body.innerHTML = '<div class="log-empty">No rides recorded yet.</div>';
    return;
  }
  body.innerHTML = '';
  rides.forEach(function(r, i) {
    var dur = r.endedAt ? new Date(r.endedAt) - new Date(r.startedAt) : null;
    var detail = r.pointCount + ' pts' + (dur ? ' \u00b7 ' + formatDuration(dur) : '');
    var pipClass = i === 0 ? 'pip-accent' : i < 3 ? 'pip-ok' : 'pip-off';
    var title = i === 0 ? 'Most Recent Ride' : 'Ride';

    var entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML =
      '<div class="log-pip ' + pipClass + '"></div>' +
      '<div style="flex:1">' +
        '<div class="log-title">' + title + '</div>' +
        '<div class="log-detail">' + detail + '</div>' +
      '</div>' +
      '<div class="log-time">' + shortDate(r.startedAt) + '</div>';
    body.appendChild(entry);
  });
}

document.getElementById('btnRefreshLog').onclick = loadRides;

// ===== HISTORY MAP =====
var historyMap = null;
var historyLine = null;

document.getElementById('btnOpenHistory').onclick = function() {
  var panel = document.getElementById('historyPanel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (!historyMap) {
    setTimeout(function() {
      historyMap = L.map('historyMap');
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd', maxZoom: 20, attribution: '&copy; CARTO'
      }).addTo(historyMap);
      historyMap.setView([36.214, -81.668], 11);
      historyMap.invalidateSize();
    }, 80);
  }
};

document.getElementById('btnCloseHistory').onclick = function() {
  document.getElementById('historyPanel').style.display = 'none';
};

document.getElementById('btnLoadHistory').onclick = loadHistory;

async function loadHistory() {
  if (!historyMap) return;
  var rawVal = document.getElementById('historyLimit').value;
  var limit = Math.max(100, Math.min(10000, parseInt(rawVal, 10) || 2000));
  document.getElementById('historyMeta').textContent = 'Loading ' + limit + ' points...';

  try {
    var res = await fetch('/pings?limit=' + limit);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var d = await res.json();
    var pings = (d.pings || []).filter(function(p) { return p.lat && p.lon; });
    pings.sort(function(a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });

    if (historyLine) { historyMap.removeLayer(historyLine); historyLine = null; }
    if (!pings.length) {
      document.getElementById('historyMeta').textContent = 'No data returned';
      return;
    }

    var coords = pings.map(function(p) { return [p.lat, p.lon]; });
    historyLine = L.polyline(coords, { color: '#6ea8fe', weight: 2, opacity: 0.65 }).addTo(historyMap);
    historyMap.fitBounds(historyLine.getBounds(), { padding: [28, 28] });
    document.getElementById('historyMeta').textContent = coords.length + ' points loaded';
  } catch (e) {
    console.error('loadHistory', e);
    document.getElementById('historyMeta').textContent = 'Error loading data';
  }
}

document.getElementById('btnFitHistory').onclick = function() {
  if (historyLine) historyMap.fitBounds(historyLine.getBounds(), { padding: [28, 28] });
};

// ===== INIT =====
async function refreshAll() {
  await Promise.all([loadLatest(), loadLastRide(), loadHealth(), loadRides()]);
}

document.getElementById('btnRefreshAll').onclick = refreshAll;

initMainMap();
refreshAll();
</script>
